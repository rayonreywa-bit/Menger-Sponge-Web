<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menger Sponge - Interactive WASM</title>
    <style>
        /* جعل اللوحة تغطي الشاشة بالكامل */
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        
        /* رسالة تحميل بسيطة تختفي عند البدء */
        #loading-screen {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; text-align: center;
            z-index: 10; transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h2>جاري تشغيل محرك الرسوميات...</h2>
        <p>استخدم WASD للتحرك والماوس للنظر</p>
    </div>

    <!-- هذا هو العنصر الذي تبحث عنه اللعبة لتضع فيه الكانفاس -->
    <div id="wasm-example"></div>

    <script type="module">
        import init from './menger_sponge_wgpu.js';

        async function run() {
            try {
                // تشغيل المحرك
                await init();
                
                // إخفاء شاشة التحميل بعد ثانية من التشغيل
                setTimeout(() => {
                    const loader = document.getElementById('loading-screen');
                    if (loader) loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1000);
                
            } catch (e) {
                console.error("Error:", e);
                document.body.innerHTML = `<h1 style="color:red; padding:20px;">حدث خطأ: ${e.message}</h1>`;
            }
        }

        run();
    </script>
</body>
</html>
