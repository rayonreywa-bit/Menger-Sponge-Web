<!DOCTYPE html>
<html>
<head>
    <title>WASM TEST V2</title>
    <style>
        /* إذا رأيت اللون الأصفر، فأنت تشاهد النسخة الجديدة */
        body { background: yellow; color: black; font-family: sans-serif; padding: 20px; }
        #status { background: white; border: 2px solid black; padding: 10px; }
    </style>
</head>
<body>
    <h1>اختبار تشغيل المحرك - نسخة 2.0</h1>
    <div id="status">جاري التحميل...</div>

    <script type="module">
        const status = document.getElementById('status');
        
        async function init_game() {
            try {
                status.innerText = "1. محاولة استيراد الجافاسكريبت...";
                const m = await import('./menger_sponge_wgpu.js');
                
                status.innerText = "2. تم الاستيراد! جاري تشغيل WASM...";
                await m.default();
                
                status.innerText = "3. يعمل بنجاح!";
                document.body.style.background = "#111"; // تحويل للخلفية المظلمة عند النجاح
            } catch (e) {
                status.innerHTML = "<b style='color:red'>❌ خطأ:</b> " + e.message;
                console.error(e);
            }
        }

        init_game();
    </script>
</body>
</html>
