<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menger Sponge Debugger</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: monospace; }
        #log {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px; background: #000; overflow-y: auto; z-index: 1000;
            line-height: 1.5; font-size: 14px;
        }
        .error { color: #ff5555; font-weight: bold; }
        .success { color: #55ff55; }
        .info { color: #5555ff; }
    </style>
</head>
<body>
    <div id="log">بدء عملية التشخيص...</div>

    <script type="module">
        const logEl = document.getElementById('log');
        function print(msg, cls = '') {
            logEl.innerHTML += `<div class="${cls}">${msg}</div>`;
            console.log(msg);
        }

        async function start() {
            print("1. فحص ملفات المشروع...", "info");
            
            try {
                print("2. محاولة تحميل ملف menger_sponge_wgpu.js...");
                // استخدام التحميل الديناميكي لتجنب تعليق المتصفح
                const wasmModule = await import('./menger_sponge_wgpu.js');
                print("✅ تم تحميل ملف الجافاسكريبت بنجاح", "success");

                print("3. محاولة تشغيل محرك اللعبة (WASM)...");
                await wasmModule.default();
                print("✅ تم تشغيل WASM بنجاح! جاري إخفاء شاشة التشخيص...", "success");
                
                setTimeout(() => { logEl.style.display = 'none'; }, 2000);
            } catch (err) {
                print("<hr>", "");
                print("❌ حدث خطأ أثناء التحميل:", "error");
                print(err.message, "error");
                print("<br>💡 تلميحات للإصلاح:", "info");
                print("- تأكد أن اسم الملف في GitHub هو menger_sponge_wgpu.js (بدون حروف كبيرة)");
                print("- تأكد من وجود ملف menger_sponge_wgpu_bg.wasm في نفس المكان");
            }
        }

        start();
    </script>
</body>
</html>
