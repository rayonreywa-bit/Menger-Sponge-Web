<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menger Sponge WebGPU</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        p { color: white; margin-bottom: 20px; }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: #00ffcc; color: black; border: none; border-radius: 5px;
            font-weight: bold;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Menger Sponge Interactive</h1>
        <p>استخدم WASD للتحرك - اضغط واسحب الماوس للنظر</p>
        <button id="start-btn">ابدأ التجربة (Start)</button>
    </div>

    <div id="wasm-example"></div>

    <script type="module">
        import init from './menger_sponge_wgpu.js';

        const btn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        btn.onclick = async () => {
            btn.innerText = "جاري التحميل...";
            try {
                await init();
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 500);
            } catch (e) {
                console.error(e);
                btn.style.background = "red";
                btn.innerText = "خطأ: " + e;
                alert("حدث خطأ أثناء التشغيل:\n" + e);
            }
        };
    </script>
</body>
</html>
