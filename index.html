<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menger Sponge - Click to Play</title>
    <style>
        body { margin: 0; background-color: #000; color: white; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* شاشة البداية */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        button {
            padding: 15px 30px; font-size: 20px; cursor: pointer;
            background: #4CAF50; color: white; border: none; border-radius: 5px;
        }
        #error-log { color: #ff5555; margin-top: 20px; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Menger Sponge WASM</h1>
        <button id="start-btn">إضغط هنا للبدء (Click to Start)</button>
        <div id="error-log"></div>
    </div>

    <div id="wasm-example"></div>

    <script type="module">
        import init from './menger_sponge_wgpu.js';

        const btn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const errorLog = document.getElementById('error-log');

        btn.onclick = async () => {
            btn.innerText = "جاري التحميل...";
            try {
                // تشغيل المحرك
                await init();
                
                // إخفاء الشاشة بعد النجاح
                overlay.style.display = 'none';
                
                // محاولة إعطاء التركيز للكانفاس فوراً
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.focus();
                    console.log("Canvas focused!");
                }
            } catch (e) {
                console.error(e);
                errorLog.innerText = "❌ خطأ في المحرك:\n" + e.message;
                btn.innerText = "فشل التشغيل";
                
                if (e.message.includes("WebGPU")) {
                    errorLog.innerText += "\n\n💡 متصفحك أو كرت الشاشة لا يدعم WebGPU حالياً.";
                }
            }
        };

        // منع القائمة اليمنى لضمان عمل أزرار اللعبة
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
